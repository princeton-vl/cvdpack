[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cvdpack"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Raistrick", email = "araistrick@princeton.edu" }
]

description = "Quantize and video-compress your RGB/Depth/Flow/SurfaceNormal datasets"
keywords = [
    "computer vision",
    "datasets"
]
classifiers = [
    "Programming Language :: Python :: 3",
]

requires-python = ">3.11.0"
dependencies = [
    "numpy<2",
    "opencv-python",
    "tqdm"
]

[project.optional-dependencies]
slurm = [
    "submitit"
]

[build-system]
# based on https://github.com/astral-sh/trusted-publishing-examples/blob/main/pyproject.toml
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

